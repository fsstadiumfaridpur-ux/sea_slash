<!doctype html>
<html lang="en">
  <head>
    <script>
      try {
        const saved = localStorage.getItem('sea_slash_theme');
        document.documentElement.dataset.theme = saved === 'light' || saved === 'dark'
          ? saved
          : window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sea Slash · Restaurant Menu</title>
    <link rel="icon" type="image/svg+xml" href="/sea-slash-logo.svg" />
    <meta name="description" content="Explore the Sea Slash menu and prices." />
    <meta property="og:title" content="Sea Slash" />
    <meta property="og:description" content="Explore the Sea Slash menu and prices." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
